[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadsearch"
version = "0.2.0"
description = "Enrich (name, e-mail) leads with job title, workplace and LinkedIn profile via search APIs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Henrik Varmer", email = "henrik@varmer.dk" }]
keywords = ["lead-enrichment", "linkedin", "sales", "search-api", "prospecting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
]
dependencies = [
    "requests>=2.20",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dns = ["dnspython>=2.0"]      # MX-record domain intelligence
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/HenrikVarmer/leadsearch"
Issues = "https://github.com/HenrikVarmer/leadsearch/issues"
"R version" = "https://github.com/HenrikVarmer/LeadSearch-R"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
